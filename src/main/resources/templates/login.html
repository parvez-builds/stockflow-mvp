<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body class="container" style="max-width:420px">
  <h3 class="mt-5 mb-3">Login</h3>
  <div class="alert alert-danger" th:if="${param.error}">Invalid email or password</div>
  <div class="alert alert-success" th:if="${param.registered}">Account created. Please log in.</div>
  <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
  <form th:action="@{/login}" method="post">
    <input class="form-control mb-2" name="username" type="email" placeholder="Email" required>
    <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3"><a href="/signup">Create an account</a></p>
</body>
</html>
